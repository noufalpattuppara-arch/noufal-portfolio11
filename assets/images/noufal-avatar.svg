<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1117"/>
      <stop offset="40%" stop-color="#4E1520"/>
      <stop offset="80%" stop-color="#7B1D28"/>
      <stop offset="100%" stop-color="#1A0A0E"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F2C5A5"/>
      <stop offset="50%" stop-color="#DE9E74"/>
      <stop offset="100%" stop-color="#A86B49"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1D1D"/>
      <stop offset="100%" stop-color="#140D0D"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FFD97D"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 120, 100, 0.45)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with studio gradient and rim light -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#rimLight)"/>

  <!-- Subtle studio grid / creative aura -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Lighting orb in background -->
  <circle cx="460" cy="220" r="90" fill="#FF5E62" opacity="0.2" filter="blur(30px)"/>
  <circle cx="160" cy="380" r="110" fill="#FFAA5A" opacity="0.15" filter="blur(40px)"/>

  <!-- Character Group -->
  <g transform="translate(0, 20)">
    <!-- Shoulders & Dark Modern Jacket -->
    <path d="M120,700 L120,530 C120,470 170,440 240,430 L300,435 L360,430 C430,440 480,470 480,530 L480,700 Z" fill="#181518" filter="url(#shadow)"/>
    <!-- Jacket lapels & inner tee -->
    <path d="M250,432 L300,550 L350,432 Z" fill="#252125"/>
    <path d="M270,432 L300,500 L330,432 Z" fill="#0D0B0D"/>
    <!-- Subtle neon rim on shoulder -->
    <path d="M122,550 C125,480 175,445 240,435" fill="none" stroke="#FF7E6B" stroke-width="3" opacity="0.7"/>
    <path d="M478,550 C475,480 425,445 360,435" fill="none" stroke="#FFA959" stroke-width="3" opacity="0.6"/>

    <!-- Neck -->
    <path d="M260,370 L340,370 L340,445 L260,445 Z" fill="url(#skinGrad)"/>
    <!-- Neck shadow -->
    <path d="M260,370 C280,395 320,395 340,370 L340,410 C320,415 280,415 260,410 Z" fill="#8C5338" opacity="0.6"/>

    <!-- Head & Face -->
    <path d="M225,230 C225,150 250,140 300,140 C350,140 375,150 375,230 C375,320 350,380 300,380 C250,380 225,320 225,230 Z" fill="url(#skinGrad)"/>
    
    <!-- Ears -->
    <ellipse cx="225" cy="245" rx="14" ry="24" fill="#DE9E74"/>
    <ellipse cx="375" cy="245" rx="14" ry="24" fill="#D38F64"/>

    <!-- Hair (Modern textured crop / quiff) -->
    <path d="M215,190 C210,130 240,85 300,80 C365,75 395,120 385,185 C375,140 350,110 300,110 C250,110 230,145 215,190 Z" fill="url(#hairGrad)"/>
    <path d="M215,190 C220,150 250,115 310,110 C370,105 385,145 385,185 L390,225 L375,225 C370,175 350,130 295,130 C250,130 230,170 225,225 L210,225 Z" fill="#140D0D"/>
    <!-- Subtle hair highlight -->
    <path d="M270,100 C300,95 340,98 355,115" stroke="rgba(255,180,150,0.3)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Well-groomed short beard / stubble shadow -->
    <path d="M238,260 C242,325 265,365 300,365 C335,365 358,325 362,260 C350,295 330,340 300,340 C270,340 250,295 238,260 Z" fill="#3D261C" opacity="0.45"/>
    <!-- Mustache -->
    <path d="M278,292 Q300,285 322,292 Q300,298 278,292 Z" fill="#2D1C14" opacity="0.75"/>

    <!-- Eyes / Eyebrows -->
    <path d="M250,205 Q270,198 285,204" stroke="#1F1511" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M315,204 Q330,198 350,205" stroke="#1F1511" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Modern Designer Glasses / Frames -->
    <rect x="240" y="212" width="50" height="34" rx="8" fill="rgba(20,20,25,0.4)" stroke="#1A181C" stroke-width="4.5"/>
    <rect x="310" y="212" width="50" height="34" rx="8" fill="rgba(20,20,25,0.4)" stroke="#1A181C" stroke-width="4.5"/>
    <line x1="290" y1="225" x2="310" y2="225" stroke="#1A181C" stroke-width="4.5"/>
    <!-- Glasses Reflection Flare -->
    <path d="M245,217 L265,217 L250,240 L245,240 Z" fill="rgba(255,255,255,0.25)"/>
    <path d="M315,217 L335,217 L320,240 L315,240 Z" fill="rgba(255,255,255,0.25)"/>

    <!-- Nose -->
    <path d="M296,225 L294,265 L306,265" stroke="#B87754" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Subtle Smile / Lips -->
    <path d="M282,310 Q300,320 318,310" stroke="#9E4D38" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>



  <!-- Bottom watermark / badge -->
  <text x="40" y="650" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.18)" letter-spacing="4">NOUFAL</text>
</svg>
