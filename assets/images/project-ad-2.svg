<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ad2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001815"/>
      <stop offset="50%" stop-color="#003B36"/>
      <stop offset="100%" stop-color="#050E0D"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ad2_bg)"/>

  <!-- Dynamic Speed Lines -->
  <g opacity="0.3">
    <line x1="100" y1="100" x2="350" y2="400" stroke="#00FFA3" stroke-width="3" stroke-dasharray="15,10"/>
    <line x1="200" y1="50" x2="450" y2="350" stroke="#00FFA3" stroke-width="1.5"/>
    <line x1="450" y1="80" x2="700" y2="380" stroke="#00FFA3" stroke-width="2.5" stroke-dasharray="25,12"/>
  </g>

  <!-- High-Energy AI Sneaker / Product Visual -->
  <g transform="translate(180, 150) rotate(-15)">
    <!-- Sole -->
    <path d="M50,180 C120,185 240,195 380,150 C360,110 320,80 240,75 C160,70 90,110 50,180 Z" fill="#111B18" stroke="#00FFA3" stroke-width="3"/>
    <path d="M70,170 C140,175 250,185 360,145" stroke="#FFFFFF" stroke-width="4"/>
    <text x="210" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#00FFA3" letter-spacing="3">AURA X</text>
  </g>

  <!-- Meta Ads Tag / Conversion Callout -->
  <rect x="40" y="40" width="160" height="34" rx="8" fill="#1877F2"/>
  <text x="120" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">META ADS CREATIVE</text>

  <rect x="610" y="40" width="150" height="34" rx="8" fill="rgba(0,255,163,0.15)" stroke="#00FFA3" stroke-width="1"/>
  <text x="685" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#00FFA3" text-anchor="middle">3.8X ROAS HOOK</text>

  <!-- Big Ad Copy in banner style like Behance Image 2 -->
  <text x="50" y="450" font-family="'Playfair Display', serif" font-size="38" font-weight="900" fill="#FFFFFF">UNLEASH PEAK HYPER-PACE</text>
  <text x="50" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#A3E635">Next-gen footwear AI commercial • 15s Hook &amp; Retention Strategy</text>

  <!-- Bottom Details -->
  <rect x="0" y="520" width="800" height="80" fill="rgba(2, 10, 8, 0.95)"/>
  <text x="35" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Aura Athletics — High-Conversion Meta Ad Suite</text>
  <text x="35" y="580" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9CA3AF">OmniFlash Visuals • Flow Video Motion • CapCut Dynamic Cutdowns</text>
</svg>
