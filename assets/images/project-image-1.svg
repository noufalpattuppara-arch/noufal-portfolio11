<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="50%" stop-color="#2D1E2F"/>
      <stop offset="100%" stop-color="#1A0F1F"/>
    </linearGradient>
    <radialGradient id="portraitGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A7A" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#803565" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#posterBg)"/>
  <rect width="800" height="600" fill="url(#portraitGlow)"/>

  <!-- Editorial Geometric Gridlines -->
  <circle cx="400" cy="270" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="80" y1="270" x2="720" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="400" y1="50" x2="400" y2="480" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Surreal Floral & AI Portrait Elements -->
  <!-- Stylized Surreal Blooming Flora -->
  <ellipse cx="400" cy="270" rx="140" ry="170" fill="url(#neonSunset)" opacity="0.85"/>
  <ellipse cx="400" cy="270" rx="110" ry="140" fill="#241029"/>
  
  <!-- Silhouette of Avant-Garde AI Muse -->
  <path d="M350,390 C340,320 370,290 400,290 C430,290 460,320 450,390 Z" fill="#FF5252" opacity="0.9"/>
  <circle cx="400" cy="230" r="50" fill="#FFEAA7"/>
  <!-- Gold Leaf / Floral crown -->
  <path d="M330,200 Q400,140 470,200 Q400,170 330,200 Z" fill="#FFD700"/>

  <!-- Editorial Magazine Poster Typography overlay -->
  <text x="70" y="110" font-family="'Playfair Display', serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">ELYSIAN</text>
  <text x="72" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FF8A7A" letter-spacing="6">ISSUE 04 // AI ART DIRECTION</text>

  <!-- Tagline block right -->
  <text x="730" y="100" font-family="'Courier New', monospace" font-size="12" fill="#FFEAA7" text-anchor="end">AI ENGINE: FLOW + NANO BANANA</text>
  <text x="730" y="125" font-family="'Courier New', monospace" font-size="12" fill="#FFFFFF" text-anchor="end">POST: CANVA &amp; LIGHTROOM</text>

  <!-- Bottom Title Bar -->
  <rect x="0" y="500" width="800" height="100" fill="rgba(15, 8, 20, 0.92)"/>
  <text x="35" y="540" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#FFFFFF">Elysian Flora — Surreal AI Portrait &amp; Poster</text>
  <text x="35" y="570" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#FF8A7A">High-Res Brand Artwork • Editorial Magazine Cover • Seedance &amp; Lightroom</text>
</svg>
