<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="char_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080B"/>
      <stop offset="50%" stop-color="#300F17"/>
      <stop offset="100%" stop-color="#0F0407"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#char_bg)"/>

  <!-- Big Kanji / Japanese Calligraphy backdrop circle -->
  <circle cx="400" cy="270" r="180" fill="#E63946" opacity="0.15"/>
  <circle cx="400" cy="270" r="170" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="10,6" opacity="0.4"/>

  <!-- Glowing Laser Katana Blade -->
  <line x1="200" y1="460" x2="600" y2="80" stroke="url(#bladeGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="460" x2="600" y2="80" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- AI Character Cyber Armor Silhouette -->
  <path d="M320,480 C320,380 360,340 400,340 C440,340 480,380 480,480 Z" fill="#1C090F" stroke="#FF3366" stroke-width="2"/>
  <!-- Helmet with glowing ruby visor -->
  <circle cx="400" cy="270" r="55" fill="#290E16" stroke="#FF3366" stroke-width="1.5"/>
  <ellipse cx="400" cy="270" rx="35" ry="12" fill="#FF3366"/>
  <ellipse cx="400" cy="270" rx="25" ry="6" fill="#FFF"/>

  <!-- Poster Editorial Typography -->
  <text x="50" y="90" font-family="'Playfair Display', serif" font-size="44" font-weight="900" fill="#FFFFFF">RONIN 2099</text>
  <text x="50" y="120" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FF3366" letter-spacing="4">// AI CONCEPT CHARACTER</text>

  <!-- Bottom Details -->
  <rect x="0" y="510" width="800" height="90" fill="rgba(12, 3, 6, 0.95)"/>
  <text x="35" y="546" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF">Ronin 2099 — AI Character Design &amp; Poster</text>
  <text x="35" y="575" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#FF3366">Nano Banana &amp; Kling Rendering • Photorealistic Texture Lighting • Poster Art</text>
</svg>
