<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="web2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131F"/>
      <stop offset="50%" stop-color="#241B35"/>
      <stop offset="100%" stop-color="#0E0A14"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#web2_bg)"/>

  <!-- Mobile + Desktop Responsive Mockup preview -->
  <g transform="translate(100, 70)">
    <!-- Desktop window -->
    <rect width="520" height="340" rx="12" fill="#0E0A17" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="35" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="18" r="5" fill="#10B981"/>

    <!-- Desktop internal content -->
    <rect x="30" y="55" width="220" height="28" rx="6" fill="url(#purpleGrad)"/>
    <rect x="30" y="95" width="160" height="12" rx="4" fill="rgba(255,255,255,0.3)"/>
    <rect x="30" y="115" width="200" height="12" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="30" y="145" width="100" height="32" rx="6" fill="#8B5CF6"/>
    <rect x="280" y="55" width="210" height="250" rx="8" fill="#1C142E" stroke="#8B5CF6" stroke-width="1"/>

    <!-- Mobile Device overlapping -->
    <rect x="420" y="120" width="160" height="280" rx="20" fill="#05030A" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="470" y="130" width="60" height="6" rx="3" fill="#333"/>
    <rect x="435" y="150" width="130" height="60" rx="6" fill="url(#purpleGrad)"/>
    <rect x="435" y="220" width="130" height="40" rx="6" fill="#1F1538"/>
    <rect x="435" y="270" width="130" height="40" rx="6" fill="#1F1538"/>
    <circle cx="500" cy="380" r="10" fill="#333"/>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="510" width="800" height="90" fill="rgba(8, 5, 12, 0.95)"/>
  <text x="35" y="546" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF">Nova Digital — Full-Stack Brand Identity &amp; Web</text>
  <text x="35" y="575" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#EC4899">Modern Responsive UI • SEO Optimized • Fast Conversion Architecture</text>
</svg>
