<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Red Telephone Gradient -->
    <linearGradient id="phoneRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C22030"/>
      <stop offset="35%" stop-color="#9E1624"/>
      <stop offset="70%" stop-color="#6F0C17"/>
      <stop offset="100%" stop-color="#42060C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="75%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="24" result="offsetblur"/>
      <feFlood flood-color="rgba(70, 10, 20, 0.45)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#phoneShadow)" transform="translate(10, 10)">
    <!-- Coiled cord on the right side -->
    <path d="M460,95 C470,80 490,80 495,95 C500,110 520,110 525,95 C530,80 550,80 555,95 C560,110 575,110 580,95" 
          fill="none" stroke="#7A131E" stroke-width="8" stroke-linecap="round"/>
    <path d="M460,95 C470,80 490,80 495,95 C500,110 520,110 525,95 C530,80 550,80 555,95 C560,110 575,110 580,95" 
          fill="none" stroke="#B31F2D" stroke-width="4" stroke-linecap="round"/>

    <!-- Handset Body (Curved Ergonomic Receiver) -->
    <!-- Left earpiece bell -->
    <path d="M90,45 C50,45 35,75 40,115 C45,150 70,175 110,175 C145,175 160,150 160,120 L135,100 C135,70 120,45 90,45 Z" fill="url(#phoneRedGrad)"/>
    <!-- Left earpiece cap rim -->
    <ellipse cx="95" cy="115" rx="35" ry="48" fill="#580812"/>
    <ellipse cx="98" cy="115" rx="28" ry="40" fill="#38040A"/>
    <!-- Left cap gloss -->
    <ellipse cx="92" cy="95" rx="14" ry="20" fill="rgba(255,255,255,0.2)"/>

    <!-- Handle Bar connecting left & right -->
    <path d="M125,85 C200,60 360,60 435,85 C440,105 430,125 410,130 C345,110 215,110 150,130 C130,125 120,105 125,85 Z" fill="url(#phoneRedGrad)"/>
    <!-- Handle Top specular highlight reflection -->
    <path d="M150,84 C210,68 350,68 410,84 C390,75 250,70 170,80 Z" fill="url(#highlightGrad)"/>

    <!-- Right mouthpiece bell -->
    <path d="M470,45 C505,45 525,75 520,115 C515,150 490,175 450,175 C415,175 400,150 400,120 L425,100 C425,70 440,45 470,45 Z" fill="url(#phoneRedGrad)"/>
    <!-- Right mouthpiece cap rim -->
    <ellipse cx="465" cy="115" rx="35" ry="48" fill="#580812"/>
    <ellipse cx="462" cy="115" rx="28" ry="40" fill="#38040A"/>
    <!-- Voice holes pattern -->
    <circle cx="462" cy="115" r="4" fill="#1A0205"/>
    <circle cx="452" cy="103" r="3.5" fill="#1A0205"/>
    <circle cx="472" cy="103" r="3.5" fill="#1A0205"/>
    <circle cx="452" cy="127" r="3.5" fill="#1A0205"/>
    <circle cx="472" cy="127" r="3.5" fill="#1A0205"/>
    <circle cx="440" cy="115" r="3" fill="#1A0205"/>
    <circle cx="484" cy="115" r="3" fill="#1A0205"/>

    <!-- Specular gloss shine on curves -->
    <path d="M70,65 C100,60 120,80 125,100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
    <path d="M490,65 C460,60 440,80 435,100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
