<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ad1_bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4A101A"/>
      <stop offset="45%" stop-color="#26060C"/>
      <stop offset="100%" stop-color="#0F0205"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#805A14"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="70%" stop-color="rgba(255, 255, 255, 0.03)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.3)"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ad1_bg)"/>

  <!-- Golden floral / celestial rings behind bottle -->
  <circle cx="400" cy="270" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.6"/>
  <circle cx="400" cy="270" r="220" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="1"/>
  
  <!-- Subtle light beam -->
  <polygon points="400,-50 250,600 550,600" fill="rgba(255, 235, 176, 0.04)"/>

  <!-- Floating Golden Sparkles / Embers -->
  <circle cx="280" cy="180" r="3" fill="#FFEBB0" filter="url(#goldGlow)"/>
  <circle cx="520" cy="210" r="4" fill="#FFEBB0" filter="url(#goldGlow)"/>
  <circle cx="320" cy="380" r="2.5" fill="#D4AF37"/>
  <circle cx="490" cy="350" r="3" fill="#D4AF37"/>
  <circle cx="370" cy="110" r="5" fill="#FFEBB0" filter="url(#goldGlow)"/>

  <!-- Luxury Perfume Bottle (AI Rendered Style) -->
  <!-- Bottle Cap (Solid Heavy Gold) -->
  <rect x="365" y="140" width="70" height="40" rx="4" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <rect x="385" y="180" width="30" height="15" fill="#AA771C"/>
  <!-- Bottle Body (Faceted Crystal Amber Liquid) -->
  <rect x="320" y="195" width="160" height="210" rx="16" fill="#1A0408" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="330" y="205" width="140" height="190" rx="10" fill="url(#ad1_bg)"/>
  <!-- Amber Liquid Fill inside bottle -->
  <rect x="335" y="245" width="130" height="145" rx="8" fill="#691522" opacity="0.85"/>
  <rect x="335" y="245" width="130" height="145" rx="8" fill="url(#goldGrad)" opacity="0.3"/>
  <!-- Specular Glass Highlights -->
  <rect x="320" y="195" width="160" height="210" rx="16" fill="url(#glassGrad)"/>
  <!-- Bottle Label -->
  <rect x="345" y="275" width="110" height="75" rx="4" fill="#0A0204" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="400" y="305" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#FFEBB0" text-anchor="middle" letter-spacing="3">ÉLIXIR</text>
  <text x="400" y="322" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="4">EAU DE PARFUM</text>
  <line x1="370" y1="332" x2="430" y2="332" stroke="#AA771C" stroke-width="0.8"/>

  <!-- Pedestal Base reflection -->
  <ellipse cx="400" cy="425" rx="160" ry="25" fill="#0A0204"/>
  <ellipse cx="400" cy="425" rx="130" ry="12" fill="url(#goldGrad)" opacity="0.25" filter="blur(6px)"/>

  <!-- Top Ribbon Badge -->
  <rect x="35" y="30" width="180" height="34" rx="17" fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="1"/>
  <text x="125" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFEBB0" text-anchor="middle" letter-spacing="1.5">AI PRODUCT AD CAMPAIGN</text>

  <!-- Bottom Title Bar -->
  <rect x="0" y="500" width="800" height="100" fill="rgba(8, 2, 4, 0.9)"/>
  <text x="35" y="540" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#FFFFFF">Élixir Noir — Commercial & Video Trailer</text>
  <text x="35" y="570" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#D4AF37">Nano Banana & OmniFlash Generation • Meta Ads High-ROAS Visuals</text>
</svg>
