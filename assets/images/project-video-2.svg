<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="chron_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B04"/>
      <stop offset="50%" stop-color="#2D1A0D"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF9E44" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#D9531E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#120B04" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#chron_bg)"/>
  <circle cx="400" cy="240" r="170" fill="url(#sunGlow)"/>

  <!-- Desert Dunes / Cinematic Mountain Landscape -->
  <path d="M0,450 Q200,340 400,410 T800,360 L800,600 L0,600 Z" fill="#1C0E05"/>
  <path d="M0,500 Q280,410 560,470 T800,450 L800,600 L0,600 Z" fill="#0E0602"/>

  <!-- Solitary Wanderer silhouette with glowing staff -->
  <g transform="translate(390, 310)">
    <circle cx="10" cy="15" r="9" fill="#000"/>
    <path d="M-5,24 L25,24 L18,75 L2,75 Z" fill="#000"/>
    <!-- Staff with pulsing glowing gem -->
    <line x1="30" y1="5" x2="30" y2="75" stroke="#FFA94D" stroke-width="2.5"/>
    <circle cx="30" cy="5" r="6" fill="#FFE066"/>
  </g>

  <!-- Play button -->
  <g transform="translate(400, 240)">
    <circle r="42" fill="rgba(0,0,0,0.65)" stroke="#FFA94D" stroke-width="2"/>
    <polygon points="-10,-18 20,0 -10,18" fill="#FFA94D"/>
  </g>

  <!-- Cinematic widescreen letterbox -->
  <rect x="0" y="0" width="800" height="40" fill="#000"/>
  <rect x="0" y="560" width="800" height="40" fill="#000"/>
  <text x="35" y="27" font-family="'Courier New', monospace" font-size="13" fill="#FFA94D" letter-spacing="2">AI CINEMATIC • AIORA ACADEMY SHOWCASE</text>

  <!-- Bottom card -->
  <rect x="0" y="470" width="800" height="90" fill="rgba(14, 6, 2, 0.9)"/>
  <text x="35" y="508" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF">Chronicles of Dune: AI Storytelling Episode</text>
  <text x="35" y="536" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#FFA94D">Seedance + Kling Engine • Cinematic Sound Design • Character Rigging</text>
</svg>
